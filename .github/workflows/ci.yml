name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: plugin
    env:
      HERMES_SOURCE: ${{ github.workspace }}/hermes-source
      HERMES_HOME: ${{ runner.temp }}/kagi-hermes-home
      TMPDIR: ${{ runner.temp }}/kagi-tmp
      PYTHONPATH: ''
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      # Keep upstream outside the plugin tree: recursive discovery must see only Kagi.
      - name: Check out pinned real Hermes interfaces and loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: d923a5eb487a17c0a68801bba9ef0f56c81040a8
          path: hermes-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Prepare isolated test environment
        run: |
          mkdir -p "$HERMES_HOME" "$TMPDIR"
          python -m venv "$RUNNER_TEMP/kagi-venv"
          "$RUNNER_TEMP/kagi-venv/bin/python" -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Syntax and whitespace checks
        run: |
          "$RUNNER_TEMP/kagi-venv/bin/python" -m compileall -q kagi tests scripts
          git diff --check
      - name: Run every offline test (no skips)
        run: '"$RUNNER_TEMP/kagi-venv/bin/python" scripts/run_tests.py'
